<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>文湖線線上隨車人力即時監控</title>
  <!-- LINE LIFF SDK v2 -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-page: #0b0f19;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --bg-row: #111827;
      --bg-standby: #182234;
      --border-main: #374151;
      --border-sub: #2d3748;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-cyan: #38bdf8;
      --accent-blue: #0284c7;
      --accent-brown: #8c4e28;
      --accent-brown-border: #b45309;
      --accent-amber: #fbbf24;
      --line-green: #06c755;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: calc(18px + var(--safe-bottom));
    }

    /* 置頂標題與搜尋固定區 */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      max-width: 540px;
      background-color: rgba(3, 7, 18, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1f2937;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 1.02rem;
      font-weight: 700;
      border-left: 4px solid var(--accent-blue);
      padding-left: 8px;
      letter-spacing: 0.4px;
      line-height: 1.3;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #1f2937;
      border: 1px solid var(--border-main);
      color: #e2e8f0;
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn:active {
      background: var(--accent-blue);
      border-color: var(--accent-cyan);
    }
    .icon-btn.primary {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* 快速搜尋列 */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.92rem;
      padding: 9px 36px 9px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder {
      color: #6b7280;
    }
    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    .search-clear-btn {
      position: absolute;
      right: 8px;
      background: #374151;
      border: none;
      color: #e5e7eb;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .search-clear-btn.visible {
      display: flex;
    }

    /* 主內容區 */
    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 10px;
      padding: 11px;
    }

    .block-card.hidden-by-filter {
      display: none;
    }

    .block-header {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .direction-badge {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-blue {
      background: var(--accent-blue);
      color: #ffffff;
      border: 1px solid var(--accent-cyan);
    }
    .badge-brown {
      background: var(--accent-brown);
      color: #ffffff;
      border: 1px solid var(--accent-brown-border);
      box-shadow: 0 0 6px rgba(180, 83, 9, 0.35);
    }

    .cmd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 350px) {
      .cmd-grid {
        grid-template-columns: 1fr;
      }
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .data-row {
      background: var(--bg-row);
      padding: 10px 12px;
      min-height: 44px;
      border-radius: 7px;
      font-size: 0.94rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .data-row:active {
      background: #374151;
      border-left-color: #10b981;
    }

    .data-main {
      font-weight: 700;
      color: #f8fafc;
      word-break: break-word;
    }
    .data-sub {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: right;
      flex-shrink: 0;
      max-width: 52%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-tip {
      font-size: 0.84rem;
      color: var(--text-sub);
      padding: 6px 4px;
    }

    .standby-box {
      background: var(--bg-standby);
      border-top: 1px dashed var(--border-main);
      border-radius: 0 0 6px 6px;
      padding: 8px 8px 4px;
      margin-top: 8px;
    }
    .standby-tag {
      font-size: 0.78rem;
      color: var(--accent-amber);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .standby-text {
      font-size: 0.86rem;
      color: #e2e8f0;
      word-break: break-word;
    }

    /* 歷史車號雙欄 */
    .history-container {
      display: flex;
      gap: 8px;
    }
    .history-col {
      flex: 1;
      min-width: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-sub);
      border-radius: 7px;
      padding: 7px;
    }
    .history-col-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      padding-bottom: 5px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border-main);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .history-row {
      padding: 8px 8px;
      min-height: 40px;
      font-size: 0.84rem;
    }
    .history-row .data-main {
      font-size: 0.84rem;
    }
    .history-row .data-sub {
      font-size: 0.74rem;
    }

    .clear-btn {
      background: none;
      border: 1px solid #4b5563;
      color: #94a3b8;
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
    }
    .clear-btn:active {
      background: #374151;
      color: #fff;
    }

    .filter-empty-state {
      display: none;
      text-align: center;
      padding: 28px 16px;
      color: var(--text-sub);
      font-size: 0.92rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-main);
      border-radius: 10px;
    }
    .filter-empty-state.visible {
      display: block;
    }

    /* 底部同步狀態列 */
    .sync-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-sub);
      padding: 4px 2px 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-dot.syncing {
      background: #fbbf24;
    }
    .status-dot.error {
      background: #ef4444;
    }

    /* 底部抽屜式聯絡彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 999;
      padding: 0;
    }
    .modal-overlay.open {
      display: flex;
    }

    .info-modal {
      background: var(--bg-panel);
      border-top: 2px solid var(--accent-cyan);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 540px;
      padding: 14px 16px calc(20px + var(--safe-bottom));
      color: #fff;
      box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.65);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #4b5563;
      border-radius: 99px;
      margin: 0 auto 10px;
    }

    .modal-header {
      font-size: 1.05rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-main);
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: #1f2937;
      border: 1px solid var(--border-main);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      color: #cbd5e1;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      font-size: 0.94rem;
      color: #cbd5e1;
    }
    .modal-meta strong {
      color: #94a3b8;
      font-weight: 600;
    }

    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .contact-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .contact-label {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .line-badge {
      color: var(--line-green);
      background: rgba(6, 199, 85, 0.14);
      border: 1px solid rgba(6, 199, 85, 0.45);
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      word-break: break-all;
    }
    .phone-value {
      color: #f8fafc;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.4px;
    }

    .action-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }
    .action-btn:active {
      opacity: 0.82;
    }
    .action-btn.disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .btn-line {
      background: var(--line-green);
      color: #ffffff;
    }
    .btn-call {
      background: var(--accent-blue);
      color: #ffffff;
    }
    .btn-copy {
      background: #111827;
      border-color: #4b5563;
      color: #e2e8f0;
    }

    /* 提示吐司 (Toast) */
    .toast {
      position: fixed;
      bottom: calc(28px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      color: #f8fafc;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- 置頂標題與快速搜尋 -->
  <header class="sticky-top">
    <div class="top-bar">
      <div class="app-title">線上隨車人力即時監控</div>
      <div class="top-actions">
        <button id="manualSyncBtn" class="icon-btn primary" type="button">立即同步</button>
        <button id="liffCloseBtn" class="icon-btn" type="button" style="display: none;">關閉</button>
      </div>
    </div>
    <div class="search-box">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        inputmode="search"
        placeholder="輸入車號、人員或 LINE 名稱快速查找..."
        autocomplete="off"
      >
      <button id="searchClearBtn" class="search-clear-btn" type="button" aria-label="清除搜尋">&times;</button>
    </div>
  </header>

  <main class="app-container">
    <!-- 1. 兩端指揮官（並排緊湊呈現） -->
    <div class="cmd-grid" id="cmdGrid">
      <section class="block-card" id="cmd1Card">
        <div class="block-header"><span id="cmd1Title">指揮官</span></div>
        <div id="cmd1Body" class="data-list">
          <div class="empty-tip">資料載入中...</div>
        </div>
      </section>

      <section class="block-card" id="cmd2Card">
        <div class="block-header"><span id="cmd2Title">指揮官</span></div>
        <div id="cmd2Body" class="data-list">
          <div class="empty-tip">資料載入中...</div>
        </div>
      </section>
    </div>

    <!-- 2. 方向一隨車（棕色） -->
    <section class="block-card" id="dir1Card">
      <div class="block-header">
        <span>方向一隨車</span>
        <span id="dir1SectionBadge" class="direction-badge badge-brown">（劍南 &lt; 中山）</span>
      </div>
      <div id="dir1DutyList" class="data-list">
        <div class="empty-tip">資料載入中...</div>
      </div>
      <div class="standby-box" id="dir1StandbyBox">
        <div class="standby-tag">待命接車</div>
        <div id="dir1Standby" class="standby-text">無</div>
      </div>
    </section>

    <!-- 3. 方向二隨車（藍色） -->
    <section class="block-card" id="dir2Card">
      <div class="block-header">
        <span>方向二隨車</span>
        <span id="dir2SectionBadge" class="direction-badge badge-blue">（劍南 &gt; 中山）</span>
      </div>
      <div id="dir2DutyList" class="data-list">
        <div class="empty-tip">資料載入中...</div>
      </div>
      <div class="standby-box" id="dir2StandbyBox">
        <div class="standby-tag">待命接車</div>
        <div id="dir2Standby" class="standby-text">無</div>
      </div>
    </section>

    <!-- 4. 歷史車號（手機保留最新各 6 筆） -->
    <section class="block-card" id="historyCard">
      <div class="block-header">
        <span style="color: #e2e8f0;">歷史車號 (最新6台)</span>
        <button id="clearHistoryBtn" class="clear-btn" type="button">清空</button>
      </div>
      <div class="history-container">
        <div class="history-col">
          <div class="history-col-title" style="color: #d97706;">方向一</div>
          <div id="dir1HistoryList" class="history-list">
            <div class="empty-tip" style="text-align: center; font-size: 0.76rem;">無紀錄</div>
          </div>
        </div>
        <div class="history-col">
          <div class="history-col-title" style="color: #38bdf8;">方向二</div>
          <div id="dir2HistoryList" class="history-list">
            <div class="empty-tip" style="text-align: center; font-size: 0.76rem;">無紀錄</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 搜尋無結果提示 -->
    <div id="filterEmptyState" class="filter-empty-state"></div>

    <!-- 底部同步狀態 -->
    <footer class="sync-bar">
      <span class="status-pill">
        <span id="statusDot" class="status-dot syncing"></span>
        <span id="syncTime">連線同步中...</span>
      </span>
      <span id="liffStatusText"></span>
    </footer>
  </main>

  <!-- 點擊展開的底部聯絡彈窗 -->
  <div id="infoModalOverlay" class="modal-overlay">
    <div class="info-modal" id="infoModalBox">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span id="modalHeaderTitle">隨車 / 執勤人員資訊</span>
        <button id="modalCloseBtn" class="close-btn" type="button" aria-label="關閉">&times;</button>
      </div>

      <div class="modal-meta">
        <div><strong>車號 / 員額：</strong><span id="modalMain">---</span></div>
        <div><strong>區段行向：</strong><span id="modalSection">---</span></div>
      </div>

      <div class="contact-card">
        <!-- LINE 名稱 / ID 區塊 -->
        <div class="contact-item">
          <div class="contact-label-row">
            <span class="contact-label">LINE 好友名稱</span>
            <span id="modalLine" class="line-badge">---</span>
          </div>
          <div class="action-btn-row">
            <button id="openLineBtn" class="action-btn btn-line disabled" type="button">直接開啟 LINE 聯絡</button>
            <button id="copyLineBtn" class="action-btn btn-copy disabled" type="button">複製名稱</button>
          </div>
        </div>

        <!-- 系統手機區塊 -->
        <div class="contact-item" style="border-top: 1px dashed #374151; padding-top: 10px;">
          <div class="contact-label-row">
            <span class="contact-label">系統手機</span>
            <span id="modalPhone" class="phone-value">---</span>
          </div>
          <div class="action-btn-row">
            <a id="callPhoneBtn" class="action-btn btn-call disabled" href="#">撥打手機</a>
            <button id="copyPhoneBtn" class="action-btn btn-copy disabled" type="button">複製號碼</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // =========================================================================
    // 1. 基本設定
    // =========================================================================
    const LIFF_ID = "2012605921-JpmplZR0";
    const API_URL = "https://script.google.com/macros/s/AKfycbzOvqIMw7X4fTKZayRE-cn-9xywUX507ggR1oqSQZhH7w_WjWwTnwd7F5RPYqHatEcz/exec";

    const SYNC_INTERVAL_MS = 10000;
    const FETCH_TIMEOUT_MS = 8000;
    const MAX_HISTORY_COUNT = 6;
    const PREV_BASELINE_TTL_MS = 2 * 60 * 60 * 1000;

    const STORAGE_KEYS = {
      historyDir1: "wh_monitor_history_dir1_v1",
      historyDir2: "wh_monitor_history_dir2_v1",
      prevDir1: "wh_monitor_prev_dir1_v1",
      prevDir2: "wh_monitor_prev_dir2_v1",
      prevUpdatedAt: "wh_monitor_prev_ts_v1"
    };

    // =========================================================================
    // 公務機 LINE 專屬好友連結對照表（免搜尋、免貼上直達個人主頁）
    // =========================================================================
    const LINE_DIRECT_LINKS = {
      "01": "https://line.me/ti/p/yGHKXQFsha",
      "車巡01": "https://line.me/ti/p/yGHKXQFsha",
      "02": "",
      "車巡02": "",
      "03": "",
      "車巡03": "",
      "04": "",
      "車巡04": "",
      "05": "",
      "車巡05": "",
      "06": "",
      "車巡06": "",
      "07": "",
      "車巡07": "",
      "08": "",
      "車巡08": "",
      "09": "",
      "車巡09": "",
      "10": "",
      "車巡10": "",
      "11": "",
      "車巡11": "",
      "12": "",
      "車巡12": "",
      "13": "",
      "車巡13": "",
      "領技01": "",
      "領技02": ""
    };

    const state = {
      latestSheetData: null,
      historyDir1: [],
      historyDir2: [],
      prevDir1: [],
      prevDir2: [],
      isFirstFetch: true,
      isFetching: false,
      searchQuery: "",
      activeContact: { lineId: "", phone: "" }
    };

    // =========================================================================
    // 2. 本地紀錄儲存（localStorage）
    // =========================================================================
    function safeReadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (err) {
        return fallback;
      }
    }

    function safeWriteJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (err) {
        // 忽略私密瀏覽或容量限制錯誤
      }
    }

    function initStoredHistory() {
      const savedH1 = safeReadJson(STORAGE_KEYS.historyDir1, []);
      const savedH2 = safeReadJson(STORAGE_KEYS.historyDir2, []);
      state.historyDir1 = Array.isArray(savedH1) ? savedH1.slice(0, MAX_HISTORY_COUNT) : [];
      state.historyDir2 = Array.isArray(savedH2) ? savedH2.slice(0, MAX_HISTORY_COUNT) : [];

      const lastTs = Number(safeReadJson(STORAGE_KEYS.prevUpdatedAt, 0));
      if (lastTs && Date.now() - lastTs < PREV_BASELINE_TTL_MS) {
        const savedP1 = safeReadJson(STORAGE_KEYS.prevDir1, []);
        const savedP2 = safeReadJson(STORAGE_KEYS.prevDir2, []);
        state.prevDir1 = Array.isArray(savedP1) ? savedP1 : [];
        state.prevDir2 = Array.isArray(savedP2) ? savedP2 : [];
        if (state.prevDir1.length > 0 || state.prevDir2.length > 0) {
          state.isFirstFetch = false;
        }
      }

      renderHistoryList("dir1HistoryList", state.historyDir1, "方向一 (歷史)");
      renderHistoryList("dir2HistoryList", state.historyDir2, "方向二 (歷史)");
    }

    function persistHistoryState() {
      safeWriteJson(STORAGE_KEYS.historyDir1, state.historyDir1);
      safeWriteJson(STORAGE_KEYS.historyDir2, state.historyDir2);
      safeWriteJson(STORAGE_KEYS.prevDir1, state.prevDir1);
      safeWriteJson(STORAGE_KEYS.prevDir2, state.prevDir2);
      safeWriteJson(STORAGE_KEYS.prevUpdatedAt, Date.now());
    }

    function clearHistory() {
      state.historyDir1 = [];
      state.historyDir2 = [];
      safeWriteJson(STORAGE_KEYS.historyDir1, []);
      safeWriteJson(STORAGE_KEYS.historyDir2, []);
      renderHistoryList("dir1HistoryList", [], "方向一 (歷史)");
      renderHistoryList("dir2HistoryList", [], "方向二 (歷史)");
      applySearchFilter();
      showToast("已清空歷史車號紀錄");
    }

    // =========================================================================
    // 3. 資料解析與過濾邏輯
    // =========================================================================
    function cleanStationName(raw) {
      if (!raw) return "";
      return String(raw).replace(/指揮官|站/g, "").trim();
    }

    function resolveSectionRanges(data) {
      const cmd1 = data.cmd1 || {};
      const cmd2 = data.cmd2 || {};

      let d2Start = cleanStationName(data.d7);
      let d2End = cleanStationName(data.k7);
      if ((!d2Start || !d2End) && data.dir2_section) {
        const parts = String(data.dir2_section).split(/➔|->|>|<|＜|＞|←|→|~|～|-|到/);
        if (parts.length >= 2) {
          if (!d2Start) d2Start = cleanStationName(parts[0]);
          if (!d2End) d2End = cleanStationName(parts[1]);
        }
      }
      if (!d2Start && cmd1.title) d2Start = cleanStationName(cmd1.title);
      if (!d2End && cmd2.title) d2End = cleanStationName(cmd2.title);
      d2Start = d2Start || "劍南";
      d2End = d2End || "中山";

      let d1Left = "";
      let d1Right = "";
      if (data.dir1_section) {
        const rawStr = String(data.dir1_section);
        const parts = rawStr.split(/➔|->|>|<|＜|＞|←|→|~|～|-|到/);
        if (parts.length >= 2) {
          if (rawStr.includes("<") || rawStr.includes("＜") || rawStr.includes("←")) {
            d1Left = cleanStationName(parts[0]);
            d1Right = cleanStationName(parts[1]);
          } else {
            d1Left = cleanStationName(parts[1]);
            d1Right = cleanStationName(parts[0]);
          }
        }
      }
      d1Left = d1Left || d2Start;
      d1Right = d1Right || d2End;

      return {
        dir2: [d2Start, d2End],
        dir1: [d1Left, d1Right]
      };
    }

    function parseContactInfo(phoneText) {
      let lineVal = "";
      let phoneVal = "";
      if (phoneText) {
        const parts = String(phoneText).trim().split(/\s+/);
        if (parts.length >= 2) {
          lineVal = parts[0];
          phoneVal = parts.slice(1).join(" ");
        } else if (parts.length === 1 && parts[0]) {
          if (/^[\d\-+#()]+$/.test(parts[0])) phoneVal = parts[0];
          else lineVal = parts[0];
        }
      }
      return { lineVal, phoneVal };
    }

    function buildTelHref(phoneText) {
      const dialable = String(phoneText || "").replace(/[^\d+*#,]/g, "");
      return dialable ? `tel:${dialable}` : "";
    }

    function resolveDirectLineUrl(lineIdOrName) {
      const cleanName = String(lineIdOrName || "").trim();
      if (!cleanName) return "";
      if (cleanName.startsWith("http://") || cleanName.startsWith("https://")) {
        return cleanName;
      }
      return LINE_DIRECT_LINKS[cleanName] || "";
    }

    function mergeHistoryDiff(prevList, curList, historyList) {
      prevList.forEach(oldItem => {
        if (!oldItem || !oldItem.main) return;
        const stillThere = curList.some(cur => cur.main === oldItem.main);
        const alreadyRecorded = historyList.some(h => h.main === oldItem.main);
        if (!stillThere && !alreadyRecorded) {
          historyList.unshift(oldItem);
        }
      });
      return historyList.slice(0, MAX_HISTORY_COUNT);
    }

    function processHistoryData(data) {
      const curDir1 = (data.dir1 && Array.isArray(data.dir1.dutyList)) ? data.dir1.dutyList : [];
      const curDir2 = (data.dir2 && Array.isArray(data.dir2.dutyList)) ? data.dir2.dutyList : [];

      if (!state.isFirstFetch) {
        state.historyDir1 = mergeHistoryDiff(state.prevDir1, curDir1, state.historyDir1);
        state.historyDir2 = mergeHistoryDiff(state.prevDir2, curDir2, state.historyDir2);
        renderHistoryList("dir1HistoryList", state.historyDir1, "方向一 (歷史)");
        renderHistoryList("dir2HistoryList", state.historyDir2, "方向二 (歷史)");
      }

      state.prevDir1 = curDir1;
      state.prevDir2 = curDir2;
      state.isFirstFetch = false;
      persistHistoryState();
    }

    // =========================================================================
    // 4. 安全 DOM 渲染與搜尋篩選
    // =========================================================================
    function createDataRow(item, sectionText, extraClass = "") {
      const row = document.createElement("div");
      row.className = extraClass ? `data-row ${extraClass}` : "data-row";
      const mainText = item.main || "";
      const phoneInfo = item.phoneInfo || "";
      row.dataset.searchText = `${mainText} ${phoneInfo}`.toLowerCase();

      const mainSpan = document.createElement("span");
      mainSpan.className = "data-main";
      mainSpan.textContent = mainText;
      row.appendChild(mainSpan);

      if (phoneInfo) {
        const subSpan = document.createElement("span");
        subSpan.className = "data-sub";
        subSpan.textContent = phoneInfo;
        row.appendChild(subSpan);
      }

      row.addEventListener("click", () => {
        openModal(mainText, phoneInfo, sectionText);
      });
      return row;
    }

    function renderCommanderBody(elemId, lines, stationText) {
      const container = document.getElementById(elemId);
      container.innerHTML = "";
      const validLines = lines.filter(Boolean);
      if (validLines.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-tip";
        empty.textContent = "無幹部排班";
        container.appendChild(empty);
        return;
      }
      validLines.forEach(line => {
        container.appendChild(createDataRow({ main: line, phoneInfo: "" }, stationText));
      });
    }

    function renderDutyList(elemId, list, sectionText) {
      const container = document.getElementById(elemId);
      container.innerHTML = "";
      if (!list || list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-tip";
        empty.textContent = "目前無隨車人員";
        container.appendChild(empty);
        return;
      }
      list.forEach(item => {
        container.appendChild(createDataRow(item, sectionText));
      });
    }

    function renderHistoryList(elemId, list, sectionText) {
      const container = document.getElementById(elemId);
      container.innerHTML = "";
      if (!list || list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-tip";
        empty.style.textAlign = "center";
        empty.style.fontSize = "0.76rem";
        empty.textContent = "無紀錄";
        container.appendChild(empty);
        return;
      }
      list.forEach(item => {
        container.appendChild(createDataRow(item, sectionText, "history-row"));
      });
    }

    function renderDashboard(data) {
      const cmd1 = data.cmd1 || {};
      const cmd2 = data.cmd2 || {};
      const dir1 = data.dir1 || {};
      const dir2 = data.dir2 || {};

      const ranges = resolveSectionRanges(data);
      const st1 = ranges.dir2[0];
      const st2 = ranges.dir2[1];

      document.getElementById("cmd1Title").textContent = cmd1.title || `${st1} 指揮官`;
      renderCommanderBody("cmd1Body", [cmd1.line1, cmd1.line2], `${st1}站`);

      document.getElementById("cmd2Title").textContent = cmd2.title || `${st2} 指揮官`;
      renderCommanderBody("cmd2Body", [cmd2.line1, cmd2.line2], `${st2}站`);

      const dir1Text = `${ranges.dir1[0]} < ${ranges.dir1[1]}`;
      document.getElementById("dir1SectionBadge").textContent = `（${dir1Text}）`;
      const dir1List = Array.isArray(dir1.dutyList) ? dir1.dutyList : [];
      renderDutyList("dir1DutyList", dir1List, dir1Text);
      document.getElementById("dir1Standby").textContent = dir1.standby || "無待命資料";

      const dir2Text = `${ranges.dir2[0]} > ${ranges.dir2[1]}`;
      document.getElementById("dir2SectionBadge").textContent = `（${dir2Text}）`;
      let dir2List = Array.isArray(dir2.dutyList) ? dir2.dutyList : [];
      if (dir2List.length === 0 && data.g10) {
        dir2List = [{ main: String(data.g10), phoneInfo: String(data.h10 || "") }];
      }
      renderDutyList("dir2DutyList", dir2List, dir2Text);
      document.getElementById("dir2Standby").textContent = dir2.standby || "無待命資料";

      applySearchFilter();
    }

    function filterCardRows(cardEl, query, extraTexts = []) {
      const rows = cardEl.querySelectorAll(".data-row");
      let matchedCount = 0;

      rows.forEach(row => {
        const text = row.dataset.searchText || "";
        const isMatch = !query || text.includes(query);
        row.style.display = isMatch ? "flex" : "none";
        if (isMatch) matchedCount++;
      });

      const extraMatched = Boolean(query) && extraTexts.some(t => t.toLowerCase().includes(query));
      const shouldHide = Boolean(query) && matchedCount === 0 && !extraMatched;
      cardEl.classList.toggle("hidden-by-filter", shouldHide);
      return !shouldHide;
    }

    function applySearchFilter() {
      const query = state.searchQuery.trim().toLowerCase();

      const cmd1Visible = filterCardRows(document.getElementById("cmd1Card"), query);
      const cmd2Visible = filterCardRows(document.getElementById("cmd2Card"), query);
      document.getElementById("cmdGrid").style.display = (cmd1Visible || cmd2Visible) ? "grid" : "none";

      const dir1StandbyText = document.getElementById("dir1Standby").textContent || "";
      const dir1Visible = filterCardRows(document.getElementById("dir1Card"), query, [dir1StandbyText]);
      document.getElementById("dir1StandbyBox").style.display =
        (!query || dir1StandbyText.toLowerCase().includes(query)) ? "block" : "none";

      const dir2StandbyText = document.getElementById("dir2Standby").textContent || "";
      const dir2Visible = filterCardRows(document.getElementById("dir2Card"), query, [dir2StandbyText]);
      document.getElementById("dir2StandbyBox").style.display =
        (!query || dir2StandbyText.toLowerCase().includes(query)) ? "block" : "none";

      const histVisible = filterCardRows(document.getElementById("historyCard"), query);

      const anyVisible = cmd1Visible || cmd2Visible || dir1Visible || dir2Visible || histVisible;
      const emptyEl = document.getElementById("filterEmptyState");
      if (query && !anyVisible) {
        emptyEl.textContent = `找不到符合「${state.searchQuery.trim()}」的車號或人員`;
        emptyEl.classList.add("visible");
      } else {
        emptyEl.classList.remove("visible");
      }
    }

    // =========================================================================
    // 5. 聯絡彈窗與快捷動作（專屬直達連結 / 複製名稱並開啟 LINE / 撥打電話）
    // =========================================================================
    function setButtonEnabled(el, enabled) {
      el.classList.toggle("disabled", !enabled);
    }

    function openModal(mainText, phoneText, sectionText) {
      document.getElementById("modalMain").textContent = mainText || "---";
      document.getElementById("modalSection").textContent = sectionText || "---";

      const { lineVal, phoneVal } = parseContactInfo(phoneText);
      state.activeContact = { lineId: lineVal, phone: phoneVal };

      document.getElementById("modalLine").textContent = lineVal || "---";
      document.getElementById("modalPhone").textContent = phoneVal || "---";

      const openLineBtn = document.getElementById("openLineBtn");
      const copyLineBtn = document.getElementById("copyLineBtn");
      const callPhoneBtn = document.getElementById("callPhoneBtn");
      const copyPhoneBtn = document.getElementById("copyPhoneBtn");

      const hasLine = Boolean(lineVal);
      const hasDirectUrl = Boolean(resolveDirectLineUrl(lineVal));
      openLineBtn.textContent = hasDirectUrl ? "直接開啟 LINE 聯絡" : "複製並開啟 LINE";

      setButtonEnabled(openLineBtn, hasLine);
      setButtonEnabled(copyLineBtn, hasLine);

      const telHref = buildTelHref(phoneVal);
      const hasPhone = Boolean(telHref);
      setButtonEnabled(callPhoneBtn, hasPhone);
      setButtonEnabled(copyPhoneBtn, Boolean(phoneVal));
      callPhoneBtn.setAttribute("href", telHref || "#");

      document.getElementById("infoModalOverlay").classList.add("open");
    }

    function closeModal() {
      document.getElementById("infoModalOverlay").classList.remove("open");
    }

    async function openLineContact() {
      const friendName = String(state.activeContact.lineId || "").trim();
      if (!friendName) return;

      // 1. 檢查是否已設定專屬直達連結（例如 01 / 車巡01）
      const directUrl = resolveDirectLineUrl(friendName);
      if (directUrl) {
        if (window.liff && typeof liff.isInClient === "function" && liff.isInClient()) {
          liff.openWindow({ url: directUrl, external: false });
        } else {
          window.open(directUrl, "_blank", "noopener");
        }
        return;
      }

      // 2. 尚未設定專屬連結的備援：自動複製名稱並跳至 LINE 聊天總列表
      await copyText(friendName, `已複製「${friendName}」，請貼上搜尋`);
      if (window.liff && typeof liff.isInClient === "function" && liff.isInClient()) {
        window.location.href = "line://nv/chat";
      } else {
        window.location.href = "https://line.me/R/nv/chat";
      }
    }

    async function copyText(text, successMsg) {
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const tempInput = document.createElement("textarea");
          tempInput.value = text;
          tempInput.style.position = "fixed";
          tempInput.style.opacity = "0";
          document.body.appendChild(tempInput);
          tempInput.focus();
          tempInput.select();
          document.execCommand("copy");
          document.body.removeChild(tempInput);
        }
        showToast(successMsg);
      } catch (err) {
        showToast("複製失敗，請長按文字手動複製");
      }
    }

    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    // =========================================================================
    // 6. 試算表同步與背景恢復自動刷新
    // =========================================================================
    function setSyncStatus(mode, text) {
      const dot = document.getElementById("statusDot");
      dot.className = "status-dot";
      if (mode === "syncing") dot.classList.add("syncing");
      if (mode === "error") dot.classList.add("error");
      document.getElementById("syncTime").textContent = text;
    }

    async function fetchSheetData(isManual = false) {
      if (state.isFetching && !isManual) return;
      state.isFetching = true;
      setSyncStatus("syncing", isManual ? "手動同步中..." : "資料同步中...");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      try {
        const sep = API_URL.includes("?") ? "&" : "?";
        const fetchUrl = `${API_URL}${sep}t=${Date.now()}&r=${Math.random().toString(36).substring(2, 8)}&nocache=1`;

        const res = await fetch(fetchUrl, {
          method: "GET",
          cache: "no-store",
          redirect: "follow",
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const json = await res.json();
        const resultData = (json && json.result) ? json.result : json;

        if (resultData && typeof resultData === "object") {
          state.latestSheetData = resultData;
          renderDashboard(resultData);
          setSyncStatus("ok", "同步 " + new Date().toLocaleTimeString("zh-TW", { hour12: false }));

          try {
            processHistoryData(resultData);
          } catch (hErr) {
            console.warn("歷史記錄處理跳過:", hErr);
          }
        }
      } catch (err) {
        clearTimeout(timeoutId);
        console.warn("抓取試算表失敗:", err);
        setSyncStatus("error", "連線失敗，稍後重試");
      } finally {
        state.isFetching = false;
      }
    }

    // =========================================================================
    // 7. LINE LIFF 初始化與事件綁定
    // =========================================================================
    async function initLiff() {
      const liffStatusEl = document.getElementById("liffStatusText");
      const closeBtn = document.getElementById("liffCloseBtn");

      if (!LIFF_ID || LIFF_ID === "請填入您的_LIFF_ID") {
        liffStatusEl.textContent = "預覽模式（尚未填入 LIFF ID）";
        return;
      }

      if (!window.liff) {
        liffStatusEl.textContent = "網頁模式";
        return;
      }

      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isInClient()) {
          liffStatusEl.textContent = "LINE 外掛模式";
          closeBtn.style.display = "inline-block";
          closeBtn.addEventListener("click", () => liff.closeWindow());
        } else {
          liffStatusEl.textContent = "瀏覽器模式";
        }
      } catch (err) {
        console.warn("LIFF 初始化失敗:", err);
        liffStatusEl.textContent = "LIFF 連線異常";
      }
    }

    function bindEvents() {
      const searchInput = document.getElementById("searchInput");
      const searchClearBtn = document.getElementById("searchClearBtn");

      searchInput.addEventListener("input", () => {
        state.searchQuery = searchInput.value;
        searchClearBtn.classList.toggle("visible", state.searchQuery.length > 0);
        applySearchFilter();
      });

      searchClearBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.searchQuery = "";
        searchClearBtn.classList.remove("visible");
        applySearchFilter();
        searchInput.focus();
      });

      document.getElementById("manualSyncBtn").addEventListener("click", () => {
        fetchSheetData(true);
      });

      document.getElementById("clearHistoryBtn").addEventListener("click", clearHistory);

      document.getElementById("infoModalOverlay").addEventListener("click", closeModal);
      document.getElementById("infoModalBox").addEventListener("click", e => e.stopPropagation());
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

      document.getElementById("openLineBtn").addEventListener("click", openLineContact);
      document.getElementById("copyLineBtn").addEventListener("click", () => {
        copyText(state.activeContact.lineId, `已複製名稱：${state.activeContact.lineId}`);
      });
      document.getElementById("copyPhoneBtn").addEventListener("click", () => {
        copyText(state.activeContact.phone, `已複製手機號碼：${state.activeContact.phone}`);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          fetchSheetData(false);
        }
      });
    }

    // 啟動初始化流程
    initStoredHistory();
    bindEvents();
    initLiff();
    fetchSheetData(false);
    setInterval(() => fetchSheetData(false), SYNC_INTERVAL_MS);
  </script>
</body>
